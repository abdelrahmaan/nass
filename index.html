<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nass — عدّة نصوص عربية</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>nass</h1>
      <p class="sub">الزق نص عربي، وشوف اتصلّح إيه فيه.</p>
    </header>

    <section class="panel">
      <label for="input">النص</label>
      <textarea id="input" rows="7" placeholder="الزق النص هنا…" dir="auto"></textarea>
      <div class="row">
        <button id="run" type="button">صحّح</button>
        <button id="sample" type="button" class="ghost">جرّب مثال</button>
        <span id="meta" class="meta"></span>
      </div>
    </section>

    <section class="panel" id="result" hidden>
      <label>الناتج</label>
      <div id="output" class="output"></div>
      <button id="copy" type="button" class="ghost">انسخ</button>

      <label class="mt">اللي اتغيّر</label>
      <div id="diff" class="diff"></div>

      <label class="mt">القواعد اللي اشتغلت</label>
      <div id="applied" class="chips"></div>
    </section>

    <footer>
      <p>starter repo لمسار Claude Code من AIXpert. اقرا <code>README.md</code> الأول.</p>
    </footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
